<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>陪玩下单 Agent</title>
  <style>
    body{margin:0;background:#111827;color:#f9fafb;font:16px system-ui}
    .app{max-width:760px;margin:auto;padding:24px}
    .panel{background:#1f2937;border:1px solid #374151;border-radius:16px;padding:18px}
    .toolbar,.composer{display:flex;gap:10px}
    .toolbar{flex-wrap:wrap}
    .toolbar input{width:120px}
    .toolbar button{white-space:nowrap}
    .messages{height:56vh;overflow:auto;margin:18px 0;display:flex;flex-direction:column;gap:10px}
    .bubble{max-width:80%;padding:12px 14px;border-radius:14px;white-space:pre-wrap}
    .user{align-self:flex-end;background:#7c3aed}
    .assistant{align-self:flex-start;background:#374151}
    .status{color:#c4b5fd;font-size:14px}
    .composer input{flex:1}
    input,button{border:1px solid #4b5563;background:#111827;color:#fff;border-radius:10px;padding:11px}
    button{background:#7c3aed;cursor:pointer}
    button:disabled{opacity:.5}
  </style>
</head>
<body>
  <main class="app">
    <h1>陪玩下单 Agent</h1>
    <section class="panel">
      <div class="toolbar">
        <input id="user" value="10001" aria-label="用户 ID">
        <input id="conversation" value="demo-001" aria-label="对话 ID">
        <button id="restore" type="button">恢复上下文</button>
      </div>
      <div id="messages" class="messages"></div>
      <form id="form" class="composer">
        <input id="message" placeholder="例如：明天晚上8点帮我找个永劫陪玩，玩两小时" autocomplete="off">
        <button id="send">发送</button>
      </form>
    </section>
  </main>
  <script>
    const form=document.querySelector('#form');
    const box=document.querySelector('#messages');
    const sendButton=document.querySelector('#send');
    const restoreButton=document.querySelector('#restore');
    const userInput=document.querySelector('#user');
    const conversationInput=document.querySelector('#conversation');

    function add(text,kind){
      const el=document.createElement('div');
      el.className=kind==='status'?'status':'bubble '+kind;
      el.textContent=text;
      box.append(el);
      box.scrollTop=box.scrollHeight;
      return el;
    }

    async function readError(response){
      try{
        const value=await response.json();
        return value.message||value.code||'请求失败';
      }catch{
        return '请求失败';
      }
    }

    restoreButton.addEventListener('click',async()=>{
      const userID=userInput.value.trim();
      const conversationID=conversationInput.value.trim();
      if(!userID||!conversationID){
        add('请先填写用户 ID 和对话 ID','status');
        return;
      }
      restoreButton.disabled=true;
      sendButton.disabled=true;
      try{
        const path='/api/v1/conversations/'+encodeURIComponent(conversationID)+'/messages?user_id='+encodeURIComponent(userID);
        const response=await fetch(path);
        if(!response.ok)throw new Error(await readError(response));
        const value=await response.json();
        box.replaceChildren();
        for(const message of value.messages)add(message.content,message.role);
        add(value.messages.length?`已恢复 ${value.messages.length} 条历史消息，可以继续对话`:'没有找到可恢复的历史消息','status');
      }catch(error){
        add('恢复失败：'+error.message,'status');
      }finally{
        restoreButton.disabled=false;
        sendButton.disabled=false;
        document.querySelector('#message').focus();
      }
    });

    form.addEventListener('submit',async e=>{
      e.preventDefault();
      const input=document.querySelector('#message');
      const text=input.value.trim();
      if(!text)return;
      add(text,'user');
      input.value='';
      sendButton.disabled=true;
      restoreButton.disabled=true;
      const answer=add('','assistant');
      const status=add('正在连接…','status');
      try{
        const response=await fetch('/api/v1/agent/chat',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({user_id:userInput.value,conversation_id:conversationInput.value,message:text})
        });
        if(!response.ok)throw new Error(await response.text());
        const reader=response.body.getReader();
        const decoder=new TextDecoder();
        let buffer='';
        while(true){
          const{value,done}=await reader.read();
          if(done)break;
          buffer+=decoder.decode(value,{stream:true});
          const events=buffer.split('\n\n');
          buffer=events.pop();
          for(const block of events){
            let type='',data={};
            for(const line of block.split('\n')){
              if(line.startsWith('event:'))type=line.slice(6).trim();
              if(line.startsWith('data:'))data=JSON.parse(line.slice(5));
            }
            if(type==='status')status.textContent=data.message;
            if(type==='delta')answer.textContent+=data.content;
            if(type==='done')status.textContent='完成';
            if(type==='error')throw new Error(data.message);
          }
        }
      }catch(error){
        status.textContent='失败';
        answer.textContent=error.message;
      }finally{
        sendButton.disabled=false;
        restoreButton.disabled=false;
        input.focus();
      }
    });
  </script>
</body>
</html>
