syntax = "proto3";

package companion.business.v1;

option go_package = "companion-agent/contracts/companion-business/gen;businessv1";

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

// CompanionBusinessService 提供陪玩下单 Agent 所需的确定性业务能力。
service CompanionBusinessService {
  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);
  rpc GetRecentOrders(GetRecentOrdersRequest) returns (GetRecentOrdersResponse);
  rpc SearchCompanions(SearchCompanionsRequest) returns (SearchCompanionsResponse);
  rpc CreateOrderDraft(CreateOrderDraftRequest) returns (CreateOrderDraftResponse);
  rpc ConfirmOrder(ConfirmOrderRequest) returns (ConfirmOrderResponse);
}

// BusinessError 表示可安全传给 Agent 的结构化业务错误。
message BusinessError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  google.protobuf.Struct details = 4;
}

message GetUserProfileRequest { string user_id = 1; }
message GetUserProfileResponse { UserProfile profile = 1; BusinessError error = 2; }

message UserProfile {
  string user_id = 1;
  repeated string favorite_game_ids = 2;
  string preferred_gender = 3;
  repeated string preferred_styles = 4;
  repeated string preferred_tags = 5;
  int64 price_min = 6;
  int64 price_max = 7;
  int32 usual_duration_minutes = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message GetRecentOrdersRequest { string user_id = 1; int32 limit = 2; }
message GetRecentOrdersResponse { repeated Order orders = 1; BusinessError error = 2; }

message SearchCompanionsRequest {
  string companion_id = 1;
  string game_id = 2;
  string gender = 3;
  int64 max_price_per_hour = 4;
  google.protobuf.Timestamp start_time = 5;
  int32 duration_minutes = 6;
  repeated string preferred_tags = 7;
  int32 limit = 8;
}
message SearchCompanionsResponse { repeated CompanionCandidate candidates = 1; BusinessError error = 2; }
message CompanionCandidate { Companion companion = 1; repeated string matched_tags = 2; int32 tag_match_count = 3; }

message Companion {
  string companion_id = 1;
  string name = 2;
  string gender = 3;
  repeated string game_ids = 4;
  repeated string styles = 5;
  string skill_level = 6;
  int64 price_per_hour = 7;
  repeated string tags = 8;
  repeated AvailableSlot available_slots = 9;
  string status = 10;
}
message AvailableSlot { google.protobuf.Timestamp start_at = 1; google.protobuf.Timestamp end_at = 2; }

message CreateOrderDraftRequest {
  string user_id = 1;
  string conversation_id = 2;
  string companion_id = 3;
  string game_id = 4;
  google.protobuf.Timestamp start_time = 5;
  int32 duration_minutes = 6;
}
message CreateOrderDraftResponse { OrderDraft draft = 1; BusinessError error = 2; }

message OrderDraft {
  string draft_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  string companion_id = 4;
  string companion_name = 5;
  string game_id = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp end_time = 8;
  int32 duration_minutes = 9;
  int64 price_per_hour = 10;
  int64 total_amount = 11;
  string status = 12;
  google.protobuf.Timestamp expires_at = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message ConfirmOrderRequest { string user_id = 1; string conversation_id = 2; string draft_id = 3; }
message ConfirmOrderResponse { Order order = 1; OrderDraft replacement_draft = 2; BusinessError error = 3; }

message Order {
  string order_id = 1;
  string draft_id = 2;
  string user_id = 3;
  string companion_id = 4;
  string companion_name = 5;
  string game_id = 6;
  google.protobuf.Timestamp start_time = 7;
  google.protobuf.Timestamp end_time = 8;
  int32 duration_minutes = 9;
  int64 price_per_hour = 10;
  int64 total_amount = 11;
  string status = 12;
  string source = 13;
  google.protobuf.Timestamp created_at = 14;
}
